<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculate interest rates with our easy-to-use Interest Rate Calculator. Enter your principal amount, interest rate, and time period to compute your interest.">
    <title>Interest Rate Calculator</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Interest Rate Calculator</h1>
    
    <div class="calculator">
        <div class="input-group">
            <label for="principal">Principal Amount:</label>
            <input type="number" id="principal" placeholder="Enter principal amount">
        </div>
        
        <div class="input-group">
            <label for="rate">Interest Rate (%):</label>
            <input type="number" id="rate" placeholder="Enter interest rate">
        </div>
        
        <div class="input-group">
            <label for="years">Time Period (years):</label>
            <input type="number" id="years" placeholder="Enter number of years">
        </div>
        
        <button id="computeBtn">Compute Interest</button>
        
        <div class="result">
            <span id="result"></span>
        </div>
    </div>
    
    <script src="dist/bundle.js"></script>
</body>
</html>
