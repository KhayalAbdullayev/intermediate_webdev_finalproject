<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculate simple interest rates easily with this online calculator tool.">
    <title>Interest Rate Calculator</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Interest Rate Calculator</h1>
    <div class="calculator">
        <label for="principal">Amount:</label>
        <input type="number" id="principal" value="1000">
        
        <label for="rate">Interest Rate (%):</label>
        <input type="number" id="rate" value="5">
        
        <label for="years">No. of Years:</label>
        <input type="number" id="years" value="2">
        
        <button id="computeBtn">Compute Interest</button>
        <span id="result"></span>
    </div>
    <script src="script.js"></script>
</body>
</html>
